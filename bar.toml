# Read by bar/check.py in Proven-Commons/mission.
# See playbook/verified-bar.md there for what each field means.

[project]
name = "rfc"
# "in-progress" until every bar item passes, then "verified".
status = "in-progress"
page = "README.md"
# GitHub handles of everyone who wrote the specification. It was drafted
# by Claude, an AI agent, for the org.
spec_authors = ["claude"]
# The program people run. A change to it voids the approval.
entry_points = ["Main.lean"]

[spec]
# Rfc3339/Types.lean and Rfc3339/IxdtfTypes.lean hold the types the
# statements are about, so they are part of the specification.
files = [
  "SPEC.md", "Spec.lean", "Spec/Defs.lean", "Spec/Leap.lean", "Spec/Ixdtf.lean",
  "Rfc3339/Types.lean", "Rfc3339/IxdtfTypes.lean",
]
# The code under proof: the functions the statements are about.
code = [
  "Rfc3339.parse", "Rfc3339.Timestamp.print", "Rfc3339.Timestamp.isValid",
  "Rfc3339.Timestamp.unixSeconds", "Rfc3339.Timestamp.compareInstant",
  "Rfc3339.fromUnixSeconds", "Rfc3339.Timestamp.isValidKnown", "Rfc3339.Timestamp.siSeconds",
  "Rfc3339.Timestamp.taiMinusUtc", "Rfc3339.fromSiSeconds", "Rfc3339.parseExt",
  "Rfc3339.Ext.print", "Rfc3339.Ext.lookup", "Rfc3339.Ext.erroneous",
]

# One entry per approval, added in a pull request the reviewer approves.
# [[spec.approval]]
# reviewer = "github-handle"
# date = "2026-11-02"
# sha256 = "..."
# record = "https://github.com/Proven-Commons/rfc/pull/<n>"

[tests]
results = "tests/TEST-RESULTS.md"
command = "python3 tests/run_tests.py"
files = ["tests/run_tests.py"]
